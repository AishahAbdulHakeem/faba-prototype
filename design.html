x<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FABA - City Page Redesign Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --navy:#0E2C32;
  --navy-soft:#2C4A52;
  --red:#AA291F;
  --red-soft:#C15046;
  --bg:#FFFFFF;
  --surface:#F6F4EF;
  --border:#E4E0D6;
  --muted:#7C8A8D;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--navy);}

.topbar{
  position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:12px 24px;flex-wrap:wrap;gap:10px;
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-left img{height:38px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.city-select{
  padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;
  font-size:13px;font-weight:600;color:var(--navy);background:#fff;
}
.toggle-wrap{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;}
.toggle-btn{border:none;background:transparent;padding:8px 18px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;color:var(--navy-soft);}
.toggle-btn.active{background:var(--navy);color:#fff;}
.note{font-size:11.5px;color:var(--muted);width:100%;}

.wrap{max-width:980px;margin:0 auto;padding:32px 24px 90px;}

h1.pagetitle{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin:0 0 6px;color:var(--navy);}
.sub{color:var(--navy-soft);font-size:14px;margin:0 0 26px;max-width:660px;line-height:1.55;}

/* ---------- CURRENT LAYOUT ---------- */
#current h2{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--navy);margin:30px 0 10px;}
#current p{font-size:14.5px;line-height:1.7;color:#222;margin:0 0 12px;}
#current ul{margin:0 0 12px;padding-left:22px;}
#current li{font-size:14.5px;line-height:1.7;color:#222;margin-bottom:6px;}
#current .wall-marker{margin-top:6px;padding:10px 14px;background:#FBEAE8;border-left:3px solid var(--red);font-size:12.5px;color:var(--red);font-style:italic;}
.current-agent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px;}
.current-agent-card{padding:14px 10px;text-align:center;}
.current-agent-card .name{font-weight:600;font-size:14px;color:var(--navy);}
.current-agent-card .brokerage{font-size:12px;color:var(--muted);}

/* ---------- REDESIGNED LAYOUT ---------- */
#redesign{display:none;}
.hero{background:var(--navy);border-radius:16px;padding:32px 30px;color:#fff;margin-bottom:24px;}
.hero .eyebrow{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red-soft);margin:0 0 8px;}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin:0 0 10px;color:#fff;}
.hero p{font-size:14px;color:#CADCE0;max-width:620px;line-height:1.6;margin:0;}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.stat-card .label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;}
.stat-card .value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--navy);}
.stat-card .value.red{color:var(--red);}

.section-label{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);margin:28px 0 12px;}

.hood-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px;}
.hood-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px;}
.hood-card .hname{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:4px;}
.hood-card .hdesc{font-size:11px;color:var(--navy-soft);line-height:1.4;}

.search-mini{display:flex;gap:10px;margin:24px 0;}
.search-mini input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;}
.search-mini select{padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;background:#fff;}

.redesign-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px;}
.redesign-card{border:1px solid var(--border);border-radius:12px;padding:13px;text-align:center;background:#fff;}
.avatar-r{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
.redesign-card .name{font-weight:600;font-size:13.5px;color:var(--navy);}
.redesign-card .brokerage{font-size:11px;color:var(--muted);}

/* Full-content tabs: nothing hidden, just organized */
.insights{border:1px solid var(--border);border-radius:14px;margin-top:30px;overflow:hidden;}
.insights-head{padding:16px 20px 0;}
.insights-head .t{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--navy);margin:0 0 2px;}
.insights-head .s{font-size:12px;color:var(--muted);margin:0 0 14px;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 20px;border-bottom:1px solid var(--border);}
.tab-btn{border:none;background:transparent;padding:10px 14px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--navy-soft);cursor:pointer;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--red);border-bottom:2px solid var(--red);}
.tab-panel{display:none;padding:20px;}
.tab-panel.active{display:block;}
.tab-panel p{font-size:13.5px;line-height:1.65;color:var(--navy-soft);margin:0 0 10px;}
.tab-panel ul{margin:0 0 10px;padding-left:20px;}
.tab-panel li{font-size:13.5px;line-height:1.65;color:var(--navy-soft);margin-bottom:5px;}
</style>
</head>

let currentCity = "washington-dc";

function populateSelect(){
  const sel = document.getElementById('citySelect');
  Object.keys(CITIES).forEach(slug=>{
    const opt = document.createElement('option');
    opt.value = slug; opt.textContent = CITIES[slug].name;
    sel.appendChild(opt);
  });
  sel.value = currentCity;
}

function initials(n){return n.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();}
const COLORS = ["#AA291F","#0E2C32","#7C8A8D","#C15046","#2C4A52"];

function renderCurrent(city){
  const el = document.getElementById('current');
  let h = `<h1 class="pagetitle">${city.name} Real Estate Market Overview</h1>
  <p class="sub">Recreated using the real, live text from the current page, in the order it actually appears.</p>`;
  city.overviewParas.forEach(p => h += `<p>${p}</p>`);

  h += `<h2>Why Buyers Are Moving to ${city.name}</h2>`;
  h += `<p>${city.tabs["Why Buyers Are Moving Here"].paras[0]}</p>`;
  h += `<ul>` + city.tabs["Why Buyers Are Moving Here"].bullets.map(b=>`<li>${b}</li>`).join("") + `</ul>`;
  if(city.tabs["Why Buyers Are Moving Here"].paras[1]) h += `<p>${city.tabs["Why Buyers Are Moving Here"].paras[1]}</p>`;

  h += `<h2>Pricing Trends and Housing Mix</h2>
  <p>${city.name} sits in a high price tier, with variation based on neighborhood and property type.</p>
  <ul>` + city.pricingList.map(p=>`<li>${p}</li>`).join("") + `</ul>
  <p>${city.pricingNote}</p>`;

  const nbhd = city.tabs["Neighborhoods in Detail"];
  h += `<h2>Neighborhoods and Local Breakdown</h2><p>${nbhd.paras[0]}</p><ul>` + nbhd.bullets.map(b=>`<li>${b}</li>`).join("") + `</ul>`;

  ["Buying: Competitive + Strategic","Selling: Precision Matters","Selling: Positioning Is Everything","Who's Buying","Investment Outlook","Looking Ahead"].forEach(key=>{
    if(!city.tabs[key]) return;
    h += `<h2>${key.replace("Who's Buying", "Buyer Profiles and Demand Sources").replace("Looking Ahead","What to Expect Moving Forward")}</h2>`;
    city.tabs[key].paras.forEach(p=> h += `<p>${p}</p>`);
    if(city.tabs[key].bullets.length) h += `<ul>` + city.tabs[key].bullets.map(b=>`<li>${b}</li>`).join("") + `</ul>`;
  });

  h += `<h2>Find a Black Real Estate Agent in ${city.name}</h2>
  <p>Explore our network of experienced Black real estate agents serving ${city.name}. Whether you're purchasing your first home, relocating, or investing, we connect you with professionals who understand the market, the process, and your long-term goals.</p>`;

  h += `<div class="wall-marker">By this point, a visitor has scrolled through every section above before reaching a single agent.</div>`;

  h += `<h2>Search Black Real Estate Agents and Realtors</h2><p>Narrow your search by browsing through our database of agents below.</p><div class="current-agent-grid" id="current-agent-grid"></div>`;

  el.innerHTML = h;
  const grid = document.getElementById('current-agent-grid');
  const sizes = [{w:120,h:150},{w:90,h:90},{w:150,h:100},{w:100,h:130},{w:130,h:95}];
  city.agents.forEach((a,i)=>{
    const s = sizes[i % sizes.length];
    const div = document.createElement('div');
    div.className = 'current-agent-card';
    div.innerHTML = `<div style="width:${s.w}px;height:${s.h}px;background:${COLORS[i%COLORS.length]};margin:0 auto 10px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;">${initials(a.name)}</div>
      <div class="name">${a.name}</div><div class="brokerage">${a.brokerage}</div>`;
    grid.appendChild(div);
  });
}

function renderRedesign(city){
  const el = document.getElementById('redesign');
  let h = `<div class="hero">
    <p class="eyebrow">${city.eyebrow}</p>
    <h1>Find a Black Real Estate Agent in ${city.name}</h1>
    <p>${city.heroBlurb}</p>
  </div>
  <div class="stat-row">
    <div class="stat-card"><div class="label">Median Home Price</div><div class="value">${city.stats.median}</div></div>
    <div class="stat-card"><div class="label">Typical Range</div><div class="value">${city.stats.range}</div></div>
    <div class="stat-card"><div class="label">Avg. Days on Market</div><div class="value red">${city.stats.days}</div></div>
  </div>
  <div class="section-label">Neighborhoods at a Glance</div>
  <div class="hood-row">` + city.neighborhoods.map(nh=>`<div class="hood-card"><div class="hname">${nh.n}</div><div class="hdesc">${nh.d}</div></div>`).join("") + `</div>
  <div class="search-mini">
    <input type="text" placeholder="Search by agent or brokerage name">
    <select><option>Any specialty</option><option>First-Time Buyers</option><option>Investment Properties</option><option>Luxury Homes</option><option>Relocation</option></select>
  </div>
  <div class="section-label" style="margin-top:6px;">Agents Serving ${city.name}</div>
  <div class="redesign-grid" id="redesign-agent-grid"></div>

  <div class="insights">
    <div class="insights-head">
      <p class="t">Full ${city.name} Market Analysis</p>
      <p class="s">Every section from the current page, organized by topic. Nothing has been removed.</p>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="tab-panels"></div>
  </div>`;

  el.innerHTML = h;
  const grid = document.getElementById('redesign-agent-grid');
  city.agents.forEach((a,i)=>{
    const div = document.createElement('div');
    div.className = 'redesign-card';
    div.innerHTML = `<div class="avatar-r" style="background:${COLORS[i%COLORS.length]}">${initials(a.name)}</div><div class="name">${a.name}</div><div class="brokerage">${a.brokerage}</div>`;
    grid.appendChild(div);
  });

  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('tab-panels');
  const keys = Object.keys(city.tabs);
  keys.forEach((key,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===0 ? ' active' : '');
    btn.textContent = key;
    btn.onclick = () => selectTab(i);
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (i===0 ? ' active' : '');
    let pc = city.tabs[key].paras.map(p=>`<p>${p}</p>`).join("");
    if(city.tabs[key].bullets.length) pc += `<ul>` + city.tabs[key].bullets.map(b=>`<li>${b}</li>`).join("") + `</ul>`;
    panel.innerHTML = pc;
    panelsEl.appendChild(panel);
  });
}

function selectTab(i){
  document.querySelectorAll('.tab-btn').forEach((b,idx)=>b.classList.toggle('active', idx===i));
  document.querySelectorAll('.tab-panel').forEach((p,idx)=>p.classList.toggle('active', idx===i));
}

function render(){
  currentCity = document.getElementById('citySelect').value;
  const city = CITIES[currentCity];
  renderCurrent(city);
  renderRedesign(city);
}

function showView(view){
  document.getElementById('current').style.display = view === 'current' ? 'block' : 'none';
  document.getElementById('redesign').style.display = view === 'redesign' ? 'block' : 'none';
  document.getElementById('btn-current').classList.toggle('active', view === 'current');
  document.getElementById('btn-redesign').classList.toggle('active', view === 'redesign');
  window.scrollTo({top:0, behavior:'instant'});
}

populateSelect();
render();
</script>
</body>
</html>
